<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="css/profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="hero-section">

    <div class="image-section">
        <img src="images/profile.png" alt="Student">
    </div>

    <div class="form-section">

        <h1>Student Profile</h1>

        <p>Complete your profile to continue.</p>

    <form> 
        <label for="name"> Full Name </label>
        <input type="text" id="name" placeholder="Enter your full name">
        <label for="college"> College </label>
        <input type="text" id="college" placeholder="Enter your college">
        <label for="branch"> Branch </label>
        <input type="text" id="branch" placeholder="Enter your branch">
        <label for="semester"> Semester </label>
        <select id="semester">
            <option>Select Semester</option>
            <option> Semester 1 </option>
            <option> Semester 2 </option>
            <option> Semester 3 </option>
            <option> Semester 4 </option>
            <option> Semester 5 </option>
            <option> Semester 6 </option>
            <option> Semester 7 </option>
            <option> Semester 8 </option>
        </select>

        <label for="goal"> Goal </label>
        <input type="text" id="goal" placeholder="Enter your goal">
        <button type="button" id="continueBtn">
    Continue →
</button>
<button type="submit"></button>
    </form>
</body>
</html>
<script src="js/profile.js"></script>
